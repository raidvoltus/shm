name: Autonomous Signal Scheduler

on:
  schedule:
    # 02:00 UTC ≈ 09:00 Asia/Jakarta (WIB = UTC+7)
    # GitHub Actions cron is always UTC.
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: idx-autonomous-runner
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "true"
      IDXBOT_USE_FIXTURE: "true"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Dependency check
        run: python scripts/check_dependencies.py

      - name: Safety guard
        run: |
          python -c "
          from idxbot.config import get_settings
          s = get_settings()
          s.assert_safe()
          assert s.live_trading is False
          print('LIVE_TRADING forced false OK')
          "

      - name: Restore state artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: idxbot-state
          path: .state
        continue-on-error: true

      - name: Health preflight
        run: python -m idxbot --health --json

      - name: Run autonomous pipeline
        run: python -m idxbot --json

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: idxbot-state
          path: .state
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload diagnostics (no secrets)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: idxbot-diagnostics
          path: |
            .state
          retention-days: 7
          if-no-files-found: ignore
