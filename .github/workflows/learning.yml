name: IDX Learning Mode (Weekend)

on:
  schedule:
    # 03:00 UTC Saturday ≈ 10:00 Asia/Jakarta
    - cron: "0 3 * * 6"
  workflow_dispatch:

concurrency:
  group: idx-learning
  cancel-in-progress: false

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      PAPER_TRADING_ONLY: "true"
      ENABLE_COLAB: "false"
      ENABLE_LOCAL_TRAINING: "true"
      MAX_TRAINING_MINUTES: "19"
      IDXBOT_USE_FIXTURE: "false"
      IDXBOT_DATA_PROVIDER_PRIORITY: "yahoo_chart"
      IDXBOT_STATE_BACKEND: "s3"
      IDXBOT_S3_ENDPOINT: ${{ secrets.IDXBOT_S3_ENDPOINT }}
      IDXBOT_S3_BUCKET: ${{ secrets.IDXBOT_S3_BUCKET }}
      IDXBOT_S3_ACCESS_KEY: ${{ secrets.IDXBOT_S3_ACCESS_KEY }}
      IDXBOT_S3_SECRET_KEY: ${{ secrets.IDXBOT_S3_SECRET_KEY }}
      IDXBOT_S3_REGION: ${{ secrets.IDXBOT_S3_REGION }}
      IDXBOT_S3_PREFIX: idxbot/state/
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Production preflight
        run: python scripts/production_preflight.py

      - name: Restore durable ML artifacts
        run: python scripts/s3_artifacts.py pull

      - name: Safety guard
        run: |
          python -c "
          from idxbot.config import get_settings
          s = get_settings()
          s.assert_safe()
          assert s.live_trading is False
          print('Learning safety OK, budget=', s.max_training_minutes)
          "


      - name: Learning pipeline
        run: |
          python -m idxbot --mode LEARNING --json

      - name: Persist durable ML artifacts
        if: success()
        run: python scripts/s3_artifacts.py push

