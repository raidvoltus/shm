name: IDX Learning Mode (Weekend)

on:
  schedule:
    # 03:00 UTC Saturday ≈ 10:00 Asia/Jakarta
    - cron: "0 3 * * 6"
  workflow_dispatch:

concurrency:
  group: idx-learning
  cancel-in-progress: false

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      PAPER_TRADING_ONLY: "true"
      ENABLE_COLAB: "false"
      ENABLE_LOCAL_TRAINING: "true"
      MAX_TRAINING_MINUTES: "19"
      IDXBOT_USE_FIXTURE: "true"
      PYTHONPATH: src
      IDXBOT_STATE_BACKEND: "local"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Safety guard (fail-closed)
        run: |
          python -c "
          import os
          from idxbot.config import get_settings, reload_settings
          assert os.environ.get('LIVE_TRADING', 'false').strip().lower() in ('0', 'false', 'no', 'off', ''), \
              'LIVE_TRADING env must not be truthy'
          reload_settings()
          s = get_settings()
          s.assert_safe()
          assert s.live_trading is False
          assert s.paper_trading is True
          print('Learning safety OK, budget=', s.max_training_minutes)
          "

      # ML artifact cross-run restore via download-artifact is dead infrastructure
      # (cannot restore from prior workflow runs). Runtime trains/loads from local
      # paths within the job. Removed silent continue-on-error restore/upload.

      - name: Learning pipeline
        run: |
          python -m idxbot --mode LEARNING --json
