name: Health Check

on:
  schedule:
    # Every 6 hours UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Health check
        run: |
          python -m idxbot --health --json
          python -c "
          from idxbot.config import Settings
          s = Settings()
          assert s.live_trading is False, 'LIVE_TRADING must be false'
          assert s.paper_trading is True
          assert s.initial_balance == 10_000_000
          print('HEALTH + SAFETY OK')
          "
