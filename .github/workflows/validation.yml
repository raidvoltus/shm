name: Model Validation Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/idxbot/ml/**"
      - "src/idxbot/ensemble/**"
      - "src/idxbot/dataset/**"
      - "src/idxbot/validation/**"
      - "tests/**"

concurrency:
  group: idx-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TRADING: "false"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      - name: Unit + adversarial leakage tests
        run: |
          python -m pytest tests/unit tests/adversarial -v --tb=short

      - name: Safety invariants
        run: |
          python -c "
          from idxbot.config import get_settings
          s = get_settings()
          assert s.live_trading is False
          assert s.n_jobs == 1
          print('invariants OK')
          "
