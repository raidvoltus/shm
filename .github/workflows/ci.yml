name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run full test suite
        env:
          PYTHONPATH: src
          LIVE_TRADING: "false"
        run: |
          pytest tests/ -v --tb=short

      - name: Safety check — LIVE_TRADING must be false
        run: |
          python -c "
          from idxbot.config import Settings
          s = Settings()
          assert s.live_trading is False, 'LIVE_TRADING must be False'
          assert s.paper_trading is True, 'PAPER_TRADING must be True'
          assert s.initial_balance == 10_000_000, 'INITIAL_BALANCE must be 10_000_000'
          print('SAFETY OK: LIVE_TRADING=false, PAPER_TRADING=true, BALANCE=10000000')
          "
