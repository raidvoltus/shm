name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run full test suite
        env:
          PYTHONPATH: src
          LIVE_TRADING: "false"
        run: |
          pytest tests/ -v --tb=short

      - name: Safety check — LIVE_TRADING must be false
        run: |
          python -c "
          from idxbot.config import Settings
          s = Settings()
          assert s.live_trading is False, 'LIVE_TRADING must be False'
          assert s.paper_trading is True, 'PAPER_TRADING must be True'
          assert s.initial_balance == 10_000_000, 'INITIAL_BALANCE must be 10_000_000'
          print('SAFETY OK: LIVE_TRADING=false, PAPER_TRADING=true, BALANCE=10000000')
          "
