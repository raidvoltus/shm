name: IDX Signal Mode (Weekday)

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: idx-signal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      PAPER_TRADING_ONLY: "true"
      EXECUTION_MODE: "SIGNAL_ONLY"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "true"
      ENABLE_COLAB: "false"
      ENABLE_LOCAL_TRAINING: "false"
      IDXBOT_USE_FIXTURE: "true"
      PYTHONPATH: src
      MAX_TRAINING_MINUTES: "19"
      IDXBOT_STATE_BACKEND: "local"
      IDXBOT_STATE_DIR: ".state"
      IDXBOT_PORTFOLIO_DIR: ".state"
      IDXBOT_LEDGER_BACKEND: "github"
      IDXBOT_LEDGER_REQUIRED: "true"
      IDXBOT_LEDGER_BRANCH: "idxbot-state"
      IDXBOT_LEDGER_PATH: "idempotency/ledger.json"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Safety guard (fail-closed)
        run: |
          python -c "
          import os
          from idxbot.config import get_settings, reload_settings
          assert os.environ.get('LIVE_TRADING', 'false').strip().lower() in ('0', 'false', 'no', 'off', ''), \
              'LIVE_TRADING env must not be truthy'
          reload_settings()
          s = get_settings()
          s.assert_safe()
          assert s.live_trading is False
          assert s.paper_trading is True
          assert getattr(s, 'paper_trading_only', True) is True
          assert getattr(s, 'execution_mode', 'SIGNAL_ONLY') == 'SIGNAL_ONLY'
          print('SAFETY OK')
          "

      - name: Ensure idxbot-state branch
        run: |
          set -e
          git fetch origin idxbot-state:idxbot-state 2>/dev/null || true
          if git rev-parse --verify idxbot-state >/dev/null 2>&1; then
            echo "idxbot-state exists"
          else
            git checkout --orphan idxbot-state
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p idempotency portfolio
            printf '%s\n' '{"schema_version":1,"entries":[]}' > idempotency/ledger.json
            printf '%s\n' '{"schema_version":1,"state_version":0,"last_updated":"","content_sha":""}' > portfolio/state.json
            git add idempotency portfolio
            git -c user.email="github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" \
              commit -m "chore: bootstrap idxbot-state"
            git push origin idxbot-state
            git checkout main || git checkout -
          fi

      - name: Restore paper portfolio from idxbot-state
        run: |
          set -e
          git fetch origin idxbot-state:idxbot-state 2>/dev/null || true
          mkdir -p .state/portfolio
          git show idxbot-state:portfolio/account.json > .state/portfolio/account.json 2>/dev/null || true
          git show idxbot-state:portfolio/positions.json > .state/portfolio/positions.json 2>/dev/null || true
          git show idxbot-state:portfolio/transactions.jsonl > .state/portfolio/transactions.jsonl 2>/dev/null || true
          git show idxbot-state:portfolio/signals.jsonl > .state/portfolio/signals.jsonl 2>/dev/null || true
          git show idxbot-state:portfolio/state.json > .state/portfolio/state.json 2>/dev/null || true
          ls -la .state/portfolio || true

      - name: Signal pipeline
        run: |
          python -m idxbot --mode SIGNAL --json

      - name: Persist paper portfolio to idxbot-state
        if: always()
        run: |
          set -e
          if [ ! -d .state/portfolio ]; then
            echo "No local portfolio"
            exit 0
          fi
          git fetch origin idxbot-state:idxbot-state 2>/dev/null || true
          git checkout idxbot-state 2>/dev/null || git checkout -b idxbot-state
          mkdir -p portfolio
          cp -a .state/portfolio/. portfolio/ || true
          git add portfolio/
          if git diff --cached --quiet; then
            echo "No portfolio changes"
          else
            git -c user.email="github-actions[bot]@users.noreply.github.com" \
                -c user.name="github-actions[bot]" \
                commit -m "chore(portfolio): persist paper account/positions/transactions"
            git pull --rebase origin idxbot-state || true
            git push origin idxbot-state
          fi
          git checkout main || git checkout -

      - name: Verify local state written (informational)
        run: |
          if [ -d .state ]; then
            find .state -type f | head -50 || true
          else
            echo "NOTE: .state not present"
          fi
