name: IDX Signal Mode (Weekday)

on:
  schedule:
    # 02:00 UTC ≈ 09:00 Asia/Jakarta (WIB = UTC+7)
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: idx-signal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      PAPER_TRADING_ONLY: "true"
      EXECUTION_MODE: "SIGNAL_ONLY"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "true"
      ENABLE_COLAB: "false"
      ENABLE_LOCAL_TRAINING: "false"
      IDXBOT_USE_FIXTURE: "true"
      PYTHONPATH: src
      MAX_TRAINING_MINUTES: "19"
      IDXBOT_STATE_BACKEND: "local"
      IDXBOT_STATE_DIR: ".state"
      IDXBOT_LEDGER_BACKEND: "github"
      IDXBOT_LEDGER_REQUIRED: "true"
      IDXBOT_LEDGER_BRANCH: "idxbot-state"
      IDXBOT_LEDGER_PATH: "idempotency/ledger.json"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Safety guard (fail-closed)
        run: |
          python -c "
          import os
          from idxbot.config import get_settings, reload_settings
          assert os.environ.get('LIVE_TRADING', 'false').strip().lower() in ('0', 'false', 'no', 'off', ''), \
              'LIVE_TRADING env must not be truthy'
          reload_settings()
          s = get_settings()
          s.assert_safe()
          assert s.live_trading is False, 'LIVE_TRADING must be False'
          assert s.paper_trading is True, 'PAPER_TRADING must be True'
          assert getattr(s, 'paper_trading_only', True) is True, 'PAPER_TRADING_ONLY must be True'
          assert getattr(s, 'execution_mode', 'SIGNAL_ONLY') == 'SIGNAL_ONLY', 'EXECUTION_MODE must be SIGNAL_ONLY'
          print('SAFETY OK: live=false paper=true mode=SIGNAL_ONLY')
          "

      - name: Ensure idxbot-state ledger branch
        run: |
          set -e
          git fetch origin idxbot-state:idxbot-state 2>/dev/null || true
          if git rev-parse --verify idxbot-state >/dev/null 2>&1; then
            echo "idxbot-state branch exists"
          else
            echo "Bootstrapping idxbot-state branch"
            git checkout --orphan idxbot-state
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p idempotency
            printf '%s\n' '{"schema_version":1,"entries":[]}' > idempotency/ledger.json
            git add idempotency/ledger.json
            git -c user.email="github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" \
              commit -m "chore: bootstrap idxbot-state idempotency ledger"
            git push origin idxbot-state
            git checkout main || git checkout -
          fi

      - name: Signal pipeline
        run: |
          python -m idxbot --mode SIGNAL --json

      - name: Verify local state written (informational)
        run: |
          if [ -d .state ]; then
            echo "Local .state directory present after run:"
            find .state -type f | head -50 || true
          else
            echo "NOTE: .state not present (SKIP or in-memory only)"
          fi
