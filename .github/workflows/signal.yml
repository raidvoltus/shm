name: IDX Signal Mode (Weekday)

on:
  schedule:
    # 02:00 UTC ≈ 09:00 Asia/Jakarta (WIB = UTC+7)
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: idx-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      PAPER_TRADING_ONLY: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "true"
      ENABLE_COLAB: "false"
      ENABLE_LOCAL_TRAINING: "false"
      IDXBOT_USE_FIXTURE: "true"
      PYTHONPATH: src
      MAX_TRAINING_MINUTES: "19"
      IDXBOT_STATE_BACKEND: "local"
      IDXBOT_STATE_DIR: ".state"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Safety guard (fail-closed)
        run: |
          python -c "
          import os
          from idxbot.config import get_settings, reload_settings
          # Env overrides must not enable live trading
          assert os.environ.get('LIVE_TRADING', 'false').strip().lower() in ('0', 'false', 'no', 'off', ''), \
              'LIVE_TRADING env must not be truthy'
          reload_settings()
          s = get_settings()
          s.assert_safe()
          assert s.live_trading is False, 'LIVE_TRADING must be False'
          assert s.paper_trading is True, 'PAPER_TRADING must be True'
          assert getattr(s, 'paper_trading_only', True) is True, 'PAPER_TRADING_ONLY must be True'
          print('SAFETY OK: live=false paper=true paper_only=true')
          "

      # State policy:
      # - Runtime uses LocalStorageBackend under .state within this job only.
      # - Missing state → PortfolioState.create_initial() (FIRST_RUN handled in code).
      # - actions/download-artifact cannot restore artifacts from prior workflow runs.
      # - Cross-run artifact restore/upload was dead infrastructure (silent failure loop).
      # - Removed restore/persist artifact steps intentionally.

      - name: Signal pipeline
        run: |
          python -m idxbot --mode SIGNAL --json

      - name: Verify local state written (informational, non-blocking for empty first paths)
        run: |
          if [ -d .state ]; then
            echo "Local .state directory present after run:"
            find .state -type f | head -50 || true
          else
            echo "NOTE: .state not present (pipeline may have SKIPPED or used in-memory only)"
          fi
