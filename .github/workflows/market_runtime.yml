name: Market Runtime

on:
  schedule:
    # signal.yml owns 02:00 UTC; mid-session slots only here
    - cron: "0 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - dry_run
          - health
      scheduled_at:
        description: "ISO scheduled_at override (e.g. 2024-06-15T09:00:00+07:00)"
        required: false
        default: ""
      dry_run:
        description: "Force dry-run"
        required: false
        default: false
        type: boolean

concurrency:
  group: idx-market-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      PAPER_TRADING_ONLY: "true"
      IDXBOT_USE_FIXTURE: "true"
      IDXBOT_STATE_BACKEND: "local"
      IDXBOT_STATE_DIR: ".state"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ENABLED: "true"
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Safety assert (fail-closed)
        run: |
          python -c "
          import os
          from idxbot.config import get_settings, reload_settings
          assert os.environ.get('LIVE_TRADING', 'false').strip().lower() in ('0', 'false', 'no', 'off', '')
          reload_settings()
          s = get_settings()
          s.assert_safe()
          assert s.live_trading is False
          assert s.paper_trading is True
          print('SAFETY OK')
          "

      - name: Run health (if requested)
        if: ${{ github.event.inputs.run_mode == 'health' }}
        run: python -m idxbot --health --json

      - name: Run dry-run
        if: ${{ github.event.inputs.run_mode == 'dry_run' || github.event.inputs.dry_run == 'true' }}
        run: |
          ARGS="--dry-run --json"
          if [ -n "${{ github.event.inputs.scheduled_at }}" ]; then
            ARGS="$ARGS --scheduled-at ${{ github.event.inputs.scheduled_at }}"
          fi
          python -m idxbot $ARGS

      - name: Run market batch
        if: ${{ github.event.inputs.run_mode != 'health' && github.event.inputs.run_mode != 'dry_run' && github.event.inputs.dry_run != 'true' }}
        run: |
          ARGS="--json"
          if [ -n "${{ github.event.inputs.scheduled_at }}" ]; then
            ARGS="$ARGS --scheduled-at ${{ github.event.inputs.scheduled_at }}"
          fi
          python -m idxbot $ARGS
