name: Market Runtime

on:
  schedule:
    # IDX regular hours (UTC). Application layer converts to Asia/Jakarta.
    # 02:00 UTC = 09:00 WIB, 05:00 UTC = 12:00 WIB, 06:30 UTC = 13:30 WIB, 09:00 UTC = 16:00 WIB
    - cron: "0 2 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - dry_run
          - health
      scheduled_at:
        description: "ISO scheduled_at override (e.g. 2024-06-15T09:00:00+07:00)"
        required: false
        default: ""
      dry_run:
        description: "Force dry-run"
        required: false
        default: false
        type: boolean

concurrency:
  group: idx-market-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LIVE_TRADING: "false"
      PAPER_TRADING: "true"
      PAPER_TRADING_ONLY: "true"
      IDXBOT_USE_FIXTURE: "false"
      IDXBOT_DATA_PROVIDER_PRIORITY: "yahoo_chart"
      IDXBOT_STATE_BACKEND: "s3"
      IDXBOT_S3_ENDPOINT: ${{ secrets.IDXBOT_S3_ENDPOINT }}
      IDXBOT_S3_BUCKET: ${{ secrets.IDXBOT_S3_BUCKET }}
      IDXBOT_S3_ACCESS_KEY: ${{ secrets.IDXBOT_S3_ACCESS_KEY }}
      IDXBOT_S3_SECRET_KEY: ${{ secrets.IDXBOT_S3_SECRET_KEY }}
      IDXBOT_S3_REGION: ${{ secrets.IDXBOT_S3_REGION }}
      IDXBOT_S3_PREFIX: idxbot/state/
      TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Production preflight
        run: python scripts/production_preflight.py

      - name: Restore durable ML artifacts
        run: python scripts/s3_artifacts.py pull

      - name: Safety assert
        run: |
          python -c "
          from idxbot.config import Settings
          s = Settings()
          assert s.live_trading is False
          assert s.paper_trading is True
          print('SAFETY OK')
          "

      - name: Run health (if requested)
        if: ${{ github.event.inputs.run_mode == 'health' }}
        run: python -m idxbot --health --json

      - name: Run dry-run
        if: ${{ github.event.inputs.run_mode == 'dry_run' || github.event.inputs.dry_run == 'true' }}
        run: |
          ARGS="--dry-run --json"
          if [ -n "${{ github.event.inputs.scheduled_at }}" ]; then
            ARGS="$ARGS --scheduled-at ${{ github.event.inputs.scheduled_at }}"
          fi
          python -m idxbot $ARGS

      - name: Run market batch
        if: ${{ github.event.inputs.run_mode != 'health' && github.event.inputs.run_mode != 'dry_run' && github.event.inputs.dry_run != 'true' }}
        run: |
          ARGS="--json"
          if [ -n "${{ github.event.inputs.scheduled_at }}" ]; then
            ARGS="$ARGS --scheduled-at ${{ github.event.inputs.scheduled_at }}"
          fi
          python -m idxbot $ARGS
